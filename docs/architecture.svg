<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>EchoGesture architecture</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .key { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
      .app { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.5; }
      .h { font-size: 17px; font-weight: 700; fill: #0f172a; }
      .t { font-size: 13px; fill: #334155; }
      .s { font-size: 12px; fill: #64748b; }
      .lbl { font-size: 13px; font-weight: 700; fill: #475569; letter-spacing: 0.06em; }
      .line { stroke: #475569; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect x="0" y="0" width="1200" height="560" rx="18" fill="#f8fafc"/>

  <text class="lbl" x="40" y="44">ON THE DEVICE: NO NETWORK, NO VIDEO LEAVES THE PHONE</text>

  <!-- Pipeline row -->
  <rect class="box" x="40" y="68" width="190" height="150" rx="12"/>
  <text class="h" x="58" y="100">Camera or video</text>
  <text class="t" x="58" y="126">Phone camera, 30 fps</text>
  <text class="t" x="58" y="146">or an .mp4 (predict())</text>
  <text class="s" x="58" y="184">exocentric: the signer</text>
  <text class="s" x="58" y="202">faces the device</text>

  <rect class="box" x="265" y="68" width="210" height="150" rx="12"/>
  <text class="h" x="283" y="100">MediaPipe Holistic</text>
  <text class="t" x="283" y="126">body, both hands, face</text>
  <text class="t" x="283" y="146">+ metric 3D hand points</text>
  <text class="s" x="283" y="184">13.7 MB · 41 ms p50 on the</text>
  <text class="s" x="283" y="202">phone CPU, 2 trackers in turn</text>

  <rect class="box" x="510" y="68" width="200" height="150" rx="12"/>
  <text class="h" x="528" y="100">Normalise</text>
  <text class="t" x="528" y="126">119 points per frame,</text>
  <text class="t" x="528" y="146">shoulder-centred, scaled,</text>
  <text class="t" x="528" y="166">gaps filled, 64 steps</text>
  <text class="s" x="528" y="202">same code in Python and Kotlin</text>

  <rect class="key" x="745" y="68" width="415" height="150" rx="12"/>
  <text class="h" x="765" y="100">EchoGesture model · INT8 ONNX · 3.3 MB</text>
  <text class="t" x="765" y="126">palm-frame 3D handshape, motion and position features</text>
  <text class="t" x="765" y="146">computed inside the graph; conv + transformer blocks</text>
  <text class="t" x="765" y="166">same-sign answer rule built into the graph</text>
  <text class="s" x="765" y="202">2,000 ASL words · 4.4 ms p95 on the phone, one thread</text>

  <path class="line" d="M 230 143 L 262 143"/>
  <path class="line" d="M 475 143 L 507 143"/>
  <path class="line" d="M 710 143 L 742 143"/>

  <!-- Outputs -->
  <rect class="box" x="745" y="256" width="415" height="78" rx="12"/>
  <text class="h" x="765" y="286">Outputs</text>
  <text class="t" x="765" y="312">word, top-5, confidence · same-sign set · embedding (for Teach)</text>
  <path class="line" d="M 952 218 L 952 253"/>

  <!-- Two consumers -->
  <text class="lbl" x="40" y="388">USED BY</text>
  <rect class="box" x="40" y="404" width="330" height="128" rx="12"/>
  <text class="h" x="58" y="436">predict(video_path) → dict</text>
  <text class="t" x="58" y="462">src/main.py, the scored entry point</text>
  <text class="t" x="58" y="482">clip_id, prediction, top5,</text>
  <text class="t" x="58" y="502">confidence, latency_ms</text>
  <text class="s" x="58" y="522">Python 3.11, CPU, Docker</text>

  <rect class="app" x="400" y="404" width="760" height="128" rx="12"/>
  <text class="h" x="420" y="436">Android app (Kotlin, Compose)</text>
  <text class="t" x="420" y="462">Live captions while the hands stay up · spoken aloud by the phone's own voice</text>
  <text class="t" x="420" y="482">Reply: the hearing person speaks, on-device speech recognition shows it as text</text>
  <text class="t" x="420" y="502">Tap to correct · Learn a sign (the app teaches) · Teach a sign (3 examples, no retraining)</text>
  <text class="s" x="420" y="522">a live-caption copy of the model, fine-tuned on windows of continuous signing</text>

  <path class="line" d="M 860 334 L 860 372 L 205 372 L 205 401"/>
  <path class="line" d="M 952 334 L 952 401"/>
</svg>
