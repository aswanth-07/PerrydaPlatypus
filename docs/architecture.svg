<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
  <title>EchoGesture On-Device Architecture</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.5; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .key { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
      .app { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.75; }
      .pill { fill: #0f172a; }
      .pill-txt { font-size: 11.5px; font-weight: 700; fill: #f8fafc; letter-spacing: 0.08em; }
      .h { font-size: 16.5px; font-weight: 700; fill: #0f172a; }
      .h-blue { font-size: 17px; font-weight: 700; fill: #1d4ed8; }
      .h-green { font-size: 16.5px; font-weight: 700; fill: #15803d; }
      .t { font-size: 13px; fill: #334155; }
      .b { font-size: 13px; font-weight: 700; fill: #0f172a; }
      .s { font-size: 12px; fill: #64748b; }
      .m { font-size: 12px; font-weight: 700; fill: #1e40af; }
      .lbl { font-size: 12px; font-weight: 700; fill: #475569; letter-spacing: 0.08em; }
      .line { stroke: #475569; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" x="1" y="1" width="1198" height="598" rx="18"/>

  <!-- Top header badge -->
  <rect class="pill" x="36" y="22" width="446" height="28" rx="14"/>
  <text class="pill-txt" x="52" y="40">100% ON-DEVICE · ZERO NETWORK · NO INTERNET PERMISSION</text>
  <text class="s" x="1164" y="40" text-anchor="end">Samsung XR Hackathon 2026 · Track 2 · Team PerrydaPlatypus</text>

  <!-- Row 1: Core pipeline -->
  <rect class="box" x="36" y="68" width="180" height="162" rx="12"/>
  <text class="h" x="52" y="98">Camera / Video</text>
  <text class="t" x="52" y="124">Phone camera (30 fps)</text>
  <text class="t" x="52" y="144">or .mp4 via predict()</text>
  <text class="s" x="52" y="188">Exocentric view:</text>
  <text class="s" x="52" y="206">signer faces device</text>

  <rect class="box" x="246" y="68" width="212" height="162" rx="12"/>
  <text class="h" x="262" y="98">MediaPipe Holistic</text>
  <text class="t" x="262" y="124">Pose, both hands, face</text>
  <text class="t" x="262" y="144">+ metric 3D hand points</text>
  <text class="s" x="262" y="188">13.7 MB · 34.1 ms p50</text>
  <text class="s" x="262" y="206">30.2 fps (2 CPU lanes)</text>

  <rect class="box" x="488" y="68" width="204" height="162" rx="12"/>
  <text class="h" x="504" y="98">Normalise</text>
  <text class="t" x="504" y="124">119 points / frame,</text>
  <text class="t" x="504" y="144">shoulder-centred &amp; scaled,</text>
  <text class="t" x="504" y="164">gaps filled, 64 steps</text>
  <text class="s" x="504" y="206">Python ↔ Kotlin &lt; 7e-6</text>

  <rect class="key" x="722" y="68" width="442" height="162" rx="12"/>
  <text class="h-blue" x="742" y="98">EchoGesture INT8 ONNX · 5.72 MB</text>
  <text class="b" x="742" y="124">2-Model Ensemble: SignNetV2 + DualStreamSignNet</text>
  <text class="t" x="742" y="146">Shared FeaturesV2 (1,238-d) · Folded RepConv + Transformer</text>
  <text class="t" x="742" y="166">Cross-gated dual streams · CondFlip + FastSetRule in graph</text>
  <text class="m" x="742" y="194">2,000 ASL words · 67.93% Top-1 (80.22% @ 1k) · 93.99% Top-5</text>
  <text class="s" x="742" y="213">3.45 ms p95 on Galaxy S26 (1 thread) · 99.06% FP32-INT8 agreement</text>

  <path class="line" d="M 216 149 L 243 149"/>
  <path class="line" d="M 458 149 L 485 149"/>
  <path class="line" d="M 692 149 L 719 149"/>

  <!-- Row 2: Outputs -->
  <rect class="box" x="722" y="266" width="442" height="82" rx="12"/>
  <text class="h" x="742" y="295">Graph Outputs (Single ONNX Call)</text>
  <text class="t" x="742" y="320">prediction · top-5 · confidence · same-sign set · 768-d embedding</text>
  <text class="s" x="742" y="338">Total bundle w/ Holistic: 19.40 MB (≤ 20 MB) · 6/6 moderate robustness pass</text>
  <path class="line" d="M 943 230 L 943 263"/>

  <!-- Row 3: Consumers -->
  <text class="lbl" x="36" y="400">CONSUMERS</text>

  <rect class="box" x="36" y="416" width="332" height="152" rx="12"/>
  <text class="h" x="54" y="446">predict(video_path) → dict</text>
  <text class="t" x="54" y="472">src/main.py — scored CLI &amp; Python API</text>
  <text class="t" x="54" y="494">Returns clip_id, prediction, top5,</text>
  <text class="t" x="54" y="514">confidence, latency_ms, pipeline_ms</text>
  <text class="s" x="54" y="548">Python 3.11 · CPU-only · Docker · ECHO_VOCAB_FILE</text>

  <rect class="app" x="394" y="416" width="770" height="152" rx="12"/>
  <text class="h-green" x="414" y="446">Offline Android App (Kotlin, Jetpack Compose, Material 3)</text>
  <text class="t" x="414" y="472"><tspan font-weight="700" fill="#0f172a">Talk:</tspan> Continuous live captions (5.72 MB live ensemble, 39.9% WER, 30.2 fps) · Offline TTS (70 ms) · Tap to correct (93.15%)</text>
  <text class="t" x="414" y="494"><tspan font-weight="700" fill="#0f172a">Two-Way Reply + Reply in Sign:</tspan> Voice/typed reply → 180° rotatable text &amp; animated real-signer ASL (0 extra model bytes)</text>
  <text class="t" x="414" y="516"><tspan font-weight="700" fill="#0f172a">Learn &amp; Dictionary:</tspan> Offline 300-sign Text-to-Sign translator &amp; interactive camera practice (737 KB real-signer keypoints)</text>
  <text class="t" x="414" y="538"><tspan font-weight="700" fill="#0f172a">Teach &amp; Videos:</tspan> Add new signs in 3–5 examples (95.8% 3-shot ISL, 0 retraining) · Picked video recognition (0.46 s p50)</text>
  <text class="s" x="414" y="558">Galaxy S26: 457 mW whole-phone power w/ model at live rate (+6 mW model share) · 12.1% 10-min thermal drift (status 0)</text>

  <path class="line" d="M 852 348 L 852 384 L 202 384 L 202 413"/>
  <path class="line" d="M 943 348 L 943 413"/>
</svg>
